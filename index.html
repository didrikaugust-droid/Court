<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CourtTrack</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" style="display:flex;align-items:center;justify-content:center;height:100vh;">
  <div class="card" style="width:360px;text-align:center;">
    
    <h1 style="margin:0;background:linear-gradient(90deg,#ff4d1a,#ff7a33);-webkit-background-clip:text;color:transparent;">
      CourtTrack
    </h1>

    <p class="small">Elite tennis performance network</p>

    <input id="name" placeholder="Name">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="login()">Enter platform</button>
  </div>
</div>

<script>
function login(){
  localStorage.setItem("user", name.value);
  window.location.href="app.html";
}
</script>

</body>
</html>
