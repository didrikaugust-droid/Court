<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CourtTrack v6</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="logo">CourtTrack</div>
</nav>

<div class="container">

<!-- FEED -->
<div id="feedView">

  <h2 id="welcome"></h2>

  <div class="card">
    <h3>Post Activity</h3>
    <input id="opponent" placeholder="Opponent">
    <input id="score" placeholder="Score">

    <button onclick="post()">Post Match</button>
  </div>

  <div id="feed"></div>
</div>

<!-- PROFILE -->
<div id="profileView" style="display:none;">
  <div class="card">
    <h2 id="profileName"></h2>
    <p id="stats"></p>
    <button onclick="toggleFollow()">Follow</button>
  </div>

  <div id="profileFeed"></div>
</div>

<!-- LEADERBOARD -->
<div id="leaderboardView" style="display:none;">
  <h2>Leaderboard</h2>
  <div id="board"></div>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottomNav">
  <button onclick="show('feed')">Feed</button>
  <button onclick="show('leaderboard')">Rank</button>
  <button onclick="show('profile')">Profile</button>
</div>

<script src="app.js"></script>
</body>
</html>
